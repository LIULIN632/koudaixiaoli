name: Android CI

# ⚠️ 这个工作流还**没有在 GitHub 上跑过一次**（源码目前只在 Gitee：见
# docs/发布门禁状态报告.md §6.5）。首次推送后请按实际报错修正工具链版本。
#
# 设计原则跟仓库既有规矩一致（CLAUDE.md / memory/00-identity.md）：
#   · 门禁只拦**新增**问题 —— lint 的既有欠债冻结在 app/lint-baseline.xml，
#     baseline 变大 = 有人偷偷加债，所以下面会检查它有没有变大。
#   · 版本号唯一真源是 gradle.properties，CI 不改版本号。
#   · `./gradlew` 在 Linux 上不一定有可执行位，先 chmod。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  verify:
    name: 单测 / 设计体系 / APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        # compileSdk 37 由 app/build.gradle.kts 指定；MIUIX 的 AAR 元数据也要求它。
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: 赋予 gradlew 可执行位
        run: chmod +x ./gradlew

      - name: 单元测试（1312+ 条，含 82 张基准图）
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: 设计体系 lint
        # ⚠️ `tools/` 是本机私有目录（不进公开仓）——有它才跑，没有就跳过
        if: ${{ hashFiles('tools/lint_design.py') != '' }}
        run: python3 tools/lint_design.py

      - name: Android Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: 组装 Debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 检查 lint-baseline 没被偷偷放大
        # baseline 是欠债清单，不是免罪符（app/build.gradle.kts:97-140 的原话）。
        # 只允许变小或不变；变大就要在 PR 里解释清楚。
        run: |
          lines=$(wc -l < app/lint-baseline.xml)
          echo "lint-baseline.xml 行数：$lines"
          if [ "$lines" -gt "${LINT_BASELINE_MAX_LINES:-400}" ]; then
            echo "::error::lint-baseline.xml 比记录的上限还大，说明新增了被冻结的问题"
            exit 1
          fi

      - name: 上传测试与 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          retention-days: 14
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore

  release:
    name: 打标签即出 Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: 还原本地签名配置
        # 四个 Secret 在仓库 Settings → Secrets and variables → Actions 里配。
        # 缺任何一个就明确失败 —— 不要出一个未签名 / debug 签名的包。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 Secret $name，无法做正式签名。见 docs/发布门禁状态报告.md §6.3"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > pocketxiaoli.jks
          cat > keystore.properties <<EOF
          storeFile=pocketxiaoli.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 组装 Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --console=plain

      - name: 重命名 + 计算 SHA-256 + 生成 changelog
        id: pack
        run: |
          version=$(grep -E '^versionName=' gradle.properties | cut -d= -f2)
          apk="app/build/outputs/apk/release/app-release.apk"
          out="口袋小鲤_v${version}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee "$out.sha256"
          # 校验和与 Apk 一起发，装之前先对一遍 —— 实测过两次不同构建
          # 会产生完全相同的字节数，所以只看大小不可靠（CLAUDE.md）。
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 口袋小鲤 ${{ steps.pack.outputs.version }}
          files: |
            ${{ steps.pack.outputs.apk }}
            ${{ steps.pack.outputs.apk }}.sha256
          generate_release_notes: true
          body: |
            仅限个人学习使用，非烟台理工学院官方应用。

            安装前请核对 SHA-256（同目录下的 `.sha256` 文件）。
