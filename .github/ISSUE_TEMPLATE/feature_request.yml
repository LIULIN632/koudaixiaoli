name: 功能建议
description: 想要一个新功能，或觉得某处该怎么改
title: "[建议] "
labels: ["needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        先说清楚**问题**，再说**方案** —— 这样别人能判断方案是不是唯一解。

        ⚠️ 本项目有几条硬边界，撞上就会被拒（见 `CLAUDE.md` 的「约束」六条）：
        不做开屏广告、不接第三方统计/埋点/追踪 SDK、不上传用户数据、
        不用付费 API 与第三方 OCR、不为提醒/问答发额外请求。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 现在是怎么个不方便法？多久遇到一次？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你想到的做法（可选）
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: "0.1.35"
    validations:
      required: false
