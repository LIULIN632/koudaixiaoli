name: 问题反馈
description: 报告一个可复现的问题（崩溃、导入失败、数据异常等）
title: "[问题] "
labels: ["needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**P0（数据丢失 / 隐私泄露 / 崩溃到无法使用）会在 24 小时内响应**，
        其余按 P1（核心流程受阻）/ P2（体验问题）/ P3（建议）排序。

        ⚠️ 提交前请先确认：截图和日志里**不要**包含学号、姓名、密码、
        完整课表或成绩。需要贴日志时，用 App 内
        「我的 → 设置 → 数据与诊断 → 导出日志」生成的版本，它已经在本机脱敏。

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - "P0 · 数据丢失 / 隐私泄露 / 崩溃到用不了"
        - "P1 · 核心流程受阻（导入不了、登录不上）"
        - "P2 · 体验问题（不好用但能用）"
        - "P3 · 建议"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 你做了什么操作、期望是什么、实际结果是什么。
      placeholder: |
        1. 打开「课表」→「导入课表」→「文件导入」
        2. 选中学校导出的教务 Excel
        3. 期望进课表；实际白屏，返回后课表还是空的
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App 版本
      description: 「我的 → 设置 → 关于与帮助」里可以看到，形如 0.1.35
      placeholder: "0.1.35"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 机型与系统版本
      placeholder: "Redmi K60 · Android 14"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: 用 App 内「导出日志」生成的文件内容。**请勿手工粘贴原始崩溃文件**，也不要贴含身份信息的截图。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我已经检查过，上面没有学号、姓名、密码、完整课表或成绩
          required: true
