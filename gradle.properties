android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

android.overridePathCheck=true

# ⚠️ 不要开 org.gradle.configuration-cache —— Gradle 每次都会提示
# "Consider enabling configuration cache to speed up this build"，但这个项目**开了更慢**。
# 实测（同机同时段，发版路径）：
#
#   只改 versionCode 后打包    不开 **53 秒**   ← 开了 99~117 秒
#   versionCode 不变时打包      不开 2~4 秒     ← 开了 <1 秒（但这不是关键路径）
#
# 原因：打包脚本每次都递增 versionCode，而配置缓存**监控 Gradle property 的变化**，
# 值一变整块失效并重算任务图（AGP 的任务图很贵）。发版才是关键路径，所以不开。
# 这是实测结论不是偏好 —— 想推翻请先复跑上面两组对照。

# ── 版本号 ──
#
# ⚠️ 放在这里而不是 app/build.gradle.kts，是为了**打包速度**。
# 实测（同机同时段）：版本号写在 build.gradle.kts 里时，仅把它 +1 再打包要
# **72.5 秒**；搬到这里只要 **53.3 秒**；两者空转都只要 2 秒左右。
# 原因：改构建脚本会让 Kotlin 编译与 R8 的增量一并失效，可版本号**根本不影响代码** ——
# 它只在最后一步被塞进 AndroidManifest。
#
# ⚠️ 改这两个值时**保持格式**：build.ps1 / build.sh 用正则按行首解析，
# 写法必须是 `versionCode=数字` 与 `versionName=数字.数字.数字`（等号两侧不留空格）。
#
# ⚠️ 千万不要把版本号写回 app/build.gradle.kts：两个打包脚本都会检测并**拒绝打包**，
# 而且那时本文件的这两个值会变成无效值（APK 里仍是 kts 那个号），是最难查的一类不一致。
#
# ── 2026-10：版本线重置为 0.1.x（与包名改名同批）──
#
# 理由：applicationId 从 `com.pocket.xiaoyan` 改成 `com.pocket.xiaoli`（见 CLAUDE.md 的改名一节），
# 在系统眼里这就是**另一个 App**；「口袋小鲤」于是从 1.1.x 那条线里独立出来，重新从 0.1.0 起算。
#
# ⚠️ **versionCode 也一起归零到 1**，这是刻意的选择、代价要记住：
# 今天先打出来的 `1.1.17 (118)` / `1.1.18 (119)` 两个**新包名**的包，versionCode 都比 1 大 ——
# **装过它们的机器必须先卸载**才能装 0.1.0（否则 INSTALL_FAILED_VERSION_DOWNGRADE）。
# 那两个包已归档到 `release/archive/`。以后的规矩：versionCode 只增不减、永不回落
#（Android 只看它判能不能覆盖安装，versionName 才是给人看的）。
versionCode=87
versionName=0.1.86
# ── 意见反馈「直接发送到表格」的凭据（可选）────────────────────────────
# 全空 ⇒ FeedbackRemote.configured == false ⇒ 反馈页不显示「直接发送」按钮，
# 用户只剩复制 / 邮件 / GitHub 三条不要凭据的通道（默认发版就是这个状态）。
#
# ⚠️ 这六个键**故意不写在本文件里**：本文件被 git 跟踪（versionCode 就在上面），
# 写在这里等于把 app_secret 提交进仓库。实际填在用户级
#   %USERPROFILE%\.gradle\gradle.properties
# Gradle 会把它合并成项目属性。项目级一旦出现同名空键会盖掉用户级的值，
# 所以别在本文件里把它们补回来。
#   FEEDBACK_FEISHU_APP_ID / _APP_SECRET / _APP_TOKEN / _TABLE_ID
#   FEEDBACK_FEISHU_REPLY_APP_TOKEN / _REPLY_TABLE_ID
#
# 表格列名须一字不差：
#   反馈表（应用可编辑）工单号 / 类型 / 内容 / 联系方式 / 匿名ID / 版本 / 平台 / 环境
#   回复表（应用只读）  工单号 / 回复 / 回复时间
